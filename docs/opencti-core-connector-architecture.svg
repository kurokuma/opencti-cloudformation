<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1080" viewBox="0 0 1600 1080" role="img" aria-labelledby="title desc">
  <title id="title">OpenCTI Core + Connector CloudFormation 構成図</title>
  <desc id="desc">単一アベイラビリティゾーンの完全プライベートOpenCTI環境。ECS FargateによるPlatform/Worker/ImportFileStix Connector、SSM中継、Cloud Map、OpenSearch/Redis/Amazon MQ、S3、CloudWatch Logs、そしてコアと別デプロイのImportFileStix Connectorスタックを示す。</desc>
  <defs>
    <style>
      text { font-family: "Segoe UI", "Yu Gothic UI", "Meiryo", Arial, sans-serif; fill: #172033; } .title { font-size: 26px; font-weight: 700; } .label { font-size: 17px; font-weight: 600; } .small { font-size: 14px; } .tiny { font-size: 12px; } .boundary { fill: #f8fafc; stroke: #718096; stroke-width: 2; rx: 14; } .subnet { fill: #eef5ff; stroke: #7aa2d8; stroke-width: 1.5; rx: 12; } .data { fill: #fff6e5; stroke: #d28a1f; stroke-width: 1.5; rx: 10; } .app { fill: #eaf8f1; stroke: #299d65; stroke-width: 1.5; rx: 10; } .edge { stroke: #4a5568; stroke-width: 2; fill: none; marker-end: url(#arrow); } .secure { stroke: #1e8e5a; stroke-width: 2.5; fill:none; marker-end: url(#arrowGreen); } .out { stroke: #b35c00; stroke-width: 2; fill:none; stroke-dasharray: 7 5; marker-end: url(#arrowOrange); } .stack { fill: #f3edff; stroke: #7e57c2; stroke-width: 1.5; rx: 10; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#4a5568"/></marker>
    <marker id="arrowGreen" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#1e8e5a"/></marker>
    <marker id="arrowOrange" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto"><path d="M0,0 L0,6 L9,3 z" fill="#b35c00"/></marker>
  </defs>
  <rect x="0" y="0" width="1600" height="1080" fill="#ffffff"/>
  <text x="40" y="42" class="title">OpenCTI Core + Connector — CloudFormation デプロイ構成</text>
  <text x="40" y="68" class="small">単一AZ ／ プライベートワークロード ／ ECS・データサービスにPublic IPなし</text>
  <rect x="35" y="95" width="1530" height="925" class="boundary"/>
  <text x="55" y="123" class="label">AWSアカウント ・ リージョン ・ VPC</text>
  <rect x="60" y="145" width="250" height="820" class="subnet"/>
  <text x="80" y="175" class="label">Public サブネット</text>
  <rect x="88" y="205" width="194" height="70" class="data"/><text x="115" y="235" class="label">NAT Gateway</text><text x="110" y="258" class="tiny">EIP1個 ・ 送信専用</text>
  <rect x="340" y="145" width="650" height="820" class="subnet"/>
  <text x="360" y="175" class="label">App サブネット — ECS Fargate、プライベート</text>
  <rect x="370" y="205" width="250" height="85" class="app"/><text x="394" y="237" class="label">SSM中継EC2</text><text x="390" y="261" class="tiny">Inbound無 ・ IMDSv2</text>
  <rect x="650" y="205" width="300" height="112" class="app"/><text x="686" y="238" class="label">ECS: Platform</text><text x="680" y="262" class="small">OpenCTI UI / GraphQL :4000</text><text x="690" y="286" class="tiny">Cloud Map: platform.opencti.local</text>
  <rect x="650" y="370" width="140" height="82" class="app"/><text x="680" y="404" class="label">Worker</text><text x="690" y="428" class="tiny">台数は可変</text>
  <rect x="810" y="370" width="140" height="82" class="stack"/><text x="824" y="402" class="label">ImportFileStix</text><text x="835" y="426" class="tiny">別スタック</text>
  <rect x="370" y="520" width="250" height="102" class="data"/><text x="399" y="553" class="label">Cloud Map DNS</text><text x="395" y="578" class="small">opencti.local</text><text x="388" y="600" class="tiny">platform Aレコード / TTL10秒</text>
  <rect x="340" y="700" width="610" height="220" class="stack"/><text x="360" y="730" class="label">ImportFileStixスタックが参照するCoreのExport値</text><text x="370" y="763" class="small">EcsClusterArn ・ AppSubnetId ・ AppSecurityGroupId</text><text x="370" y="790" class="small">OpenCTIInternalUrl = http://platform.opencti.local:4000</text><text x="370" y="830" class="tiny">ConnectorExecutionRole: Secretトークン取得 + S3のenvファイル取得</text><text x="370" y="855" class="tiny">ConnectorTaskRole: ECS Exec用SSMチャネル。タスクにPublic IPなし</text>
  <rect x="1020" y="145" width="510" height="820" class="subnet"/>
  <text x="1040" y="175" class="label">Data サブネット / リージョナルサービス</text>
  <rect x="1050" y="205" width="200" height="75" class="data"/><text x="1080" y="237" class="label">OpenSearch</text><text x="1068" y="260" class="tiny">VPCドメイン ・ HTTPS 443</text>
  <rect x="1280" y="205" width="210" height="75" class="data"/><text x="1335" y="237" class="label">Redis 7.1</text><text x="1325" y="260" class="tiny">TLS/認証 ・ 6379</text>
  <rect x="1050" y="320" width="200" height="75" class="data"/><text x="1084" y="352" class="label">Amazon MQ</text><text x="1070" y="375" class="tiny">RabbitMQ ・ AMQPS 5671</text>
  <rect x="1280" y="320" width="210" height="75" class="data"/><text x="1332" y="352" class="label">Secrets Manager</text><text x="1315" y="375" class="tiny">管理者/暗号鍵/Redis/MQ</text>
  <rect x="1050" y="445" width="440" height="93" class="data"/><text x="1215" y="477" class="label">S3 Live</text><text x="1175" y="500" class="tiny">バージョニング ・ SSE-S3</text><text x="1170" y="522" class="tiny">Gateway Endpoint</text>
  <rect x="1050" y="590" width="440" height="74" class="data"/><text x="1200" y="622" class="label">CloudWatch Logs</text><text x="1092" y="646" class="tiny">/ecs/{project}/platform ・ worker ・ /ecs/opencti/connectors/{name}</text>
  <text x="65" y="1000" class="tiny">外部からの管理アクセス: AWS CLI / コンソール → Systems Manager Session Manager → SSM中継 → platform:4000。ALBやインターネット向けエンドポイントは作成しない。</text>
  <rect x="85" y="350" width="200" height="85" class="boundary"/><text x="115" y="383" class="label">管理者</text><text x="105" y="408" class="tiny">ブラウザ+SSMセッション</text>
  <path d="M285 393 L370 247" class="secure"/><text x="285" y="318" class="tiny">SSMポートフォワード</text>
  <path d="M620 247 L650 261" class="secure"/><text x="565" y="237" class="tiny">TCP 4000</text>
  <path d="M650 261 L620 570" class="edge"/><path d="M620 570 L650 261" class="edge"/>
  <path d="M720 370 L760 317" class="secure"/><text x="710" y="344" class="tiny">HTTP :4000</text>
  <path d="M880 370 L845 317" class="secure"/><text x="870" y="344" class="tiny">HTTP :4000</text>
  <path d="M950 261 L1050 242" class="secure"/><text x="962" y="238" class="tiny">HTTPS / SigV4</text>
  <path d="M950 275 L1280 242" class="secure"/><text x="1110" y="282" class="tiny">TLS 6379</text>
  <path d="M950 292 L1050 356" class="secure"/><text x="960" y="335" class="tiny">AMQPS 5671 / mgmt 443</text>
  <path d="M950 305 L1280 356" class="edge"/><text x="1115" y="346" class="tiny">タスク実行用Secret</text>
  <path d="M950 302 L1050 485" class="secure"/><text x="970" y="420" class="tiny">S3 Gateway Endpoint経由HTTPS</text>
  <path d="M720 317 L1120 590" class="edge"/><path d="M720 452 L1160 590" class="edge"/><path d="M880 452 L1300 590" class="edge"/>
  <path d="M650 290 L282 240" class="out"/><text x="360" y="225" class="tiny">制御された送信専用インターネット接続</text>
</svg>
